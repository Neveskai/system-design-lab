worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;   # logging every request costs CPU and disk IO at high RPS

  # Docker embedded DNS. `resolve` below re-reads A records, so `--scale api=N`
  # changes the pool without restarting nginx (like ALB target registration).
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 2s;
  # valid=5s caused 502 bursts: one failed DNS lookup under load emptied the pool
  # ("api could not be resolved" -> "no live upstreams"). See NOTES.md, experiment E6.

  upstream api_pool {
    zone api_pool 64k;
    least_conn;                      # try round_robin vs least_conn with /render (uneven cost)
    server api:3000 resolve max_fails=3 fail_timeout=5s;
    keepalive 128;                   # reuse TCP connections to upstream: no handshake per request
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      proxy_next_upstream error timeout http_502 http_503;   # retry on another replica
      proxy_next_upstream_tries 2;
    }
  }

  server {
    listen 8080;
    location /stub_status { stub_status; }
  }
}
