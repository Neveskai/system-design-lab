# Edge cache ("CDN") in front of object storage and the API.
# One container stands for one CloudFront edge location: no real geography here,
# so what we measure is offload (who stops doing work) and staleness, not distance.
worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;
  resolver 127.0.0.11 valid=30s ipv6=off;

  # tmpfs-backed cache (see compose). keys_zone holds keys in shared memory,
  # bodies live in files. `inactive` evicts objects nobody asked for in 10 min.
  proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:32m max_size=400m
                   inactive=10m use_temp_path=off;

  upstream s3_origin {
    zone s3_origin 64k;
    server seaweedfs:8333 resolve;
    keepalive 64;
  }
  upstream api_origin {
    zone api_origin 64k;
    server nginx:80 resolve;
    keepalive 64;
  }

  server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache cdn;
    proxy_cache_lock on;              # one origin fetch per key on a miss (edge singleflight)
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale updating error timeout;   # origin down => serve stale, not 502
    add_header X-Cache $upstream_cache_status always;

    # Static objects: bucket "attachments". Origin sends no Cache-Control,
    # so the edge decides the TTL (CloudFront "default TTL").
    location /attachments/ {
      proxy_pass http://s3_origin;
      proxy_set_header Host seaweedfs:8333;
      proxy_cache_valid 200 ${CDN_TTL};
    }

    # Dynamic content: the API decides via Cache-Control (RENDER_MAX_AGE).
    # No Cache-Control => nginx does not cache it (default for dynamic routes).
    location /docs/ {
      proxy_pass http://api_origin;
    }
  }
}
