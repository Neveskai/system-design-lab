# Shared observability stack. Labs pull this in with `include:`.
# Prometheus scrapes app services through Docker DNS, so `--scale api=N`
# is picked up automatically (each replica is one A record).
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # k6 pushes its metrics here
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

  # Per-container CPU / memory / network from the Docker Engine API.
  # (cAdvisor cannot see containers on Docker Desktop with the containerd image store.)
  # Read-only socket mount still gives full Docker API access: lab use only.
  docker-stats:
    image: node:24-alpine
    command: ["node", "/exporter/exporter.mjs"]
    environment:
      PROJECT_FILTER: ${COMPOSE_PROJECT_NAME:-}
    volumes:
      - ./docker-stats:/exporter:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
